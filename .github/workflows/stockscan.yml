name: Small-cap scan

# Weekdays after the NSE close (17:00 IST): download prices, backtest, scan, and publish
# report.md to the "stockscan" release. With the NTFY_TOPIC secret set, the phone gets the
# monthly buy list and any switch to or from cash.
on:
  push:
    paths:
      - "stockscan/**"
      - ".github/workflows/stockscan.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: stockscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stockscan/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      # Prices and the last alert sent survive between runs.
      - uses: actions/cache@v4
        with:
          path: stockscan/data
          key: stockscan-data-${{ github.run_id }}
          restore-keys: stockscan-data-
      # Yahoo refuses GitHub's servers (429), so data runs are by hand only; the app runs them on the phone.
      - name: Backtest and scan
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m stockscan --capital 150000 --data data --out report
      - name: Publish report
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f report/report.md || exit 0
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
          gh release view stockscan >/dev/null 2>&1 || gh release create stockscan --prerelease --title "Small-cap scan" \
            --notes "Updated every weekday after the market closes. Open report.md." --target "$GITHUB_SHA"
          gh release upload stockscan report/report.md report/picks.json report/equity.csv --clobber
