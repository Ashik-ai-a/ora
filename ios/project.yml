# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen
name: Airbox
options:
  bundleIdPrefix: app.airbox
  deploymentTarget:
    iOS: "17.0"   # Live Activity buttons (App Intents) need iOS 17
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""   # set your team
targets:
  Airbox:
    type: application
    platform: iOS
    sources: [Airbox, Shared]
    info:
      path: Airbox/Info.plist
      properties:
        CFBundleDisplayName: Airbox
        CFBundleURLTypes:
          - CFBundleURLSchemes: [airbox]
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Scan the QR code that Airbox shows on your Android phone.
        NSLocalNetworkUsageDescription: Airbox talks directly to your Android phone over this Wi-Fi network. Nothing goes through the internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - target: AirboxWidgets
  AirboxWidgets:
    type: app-extension
    platform: iOS
    sources: [AirboxWidgets, Shared]
    info:
      path: AirboxWidgets/Info.plist
      properties:
        CFBundleDisplayName: Airbox
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
